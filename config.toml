# Place this file at:  .streamlit/config.toml
# It sets the base theme so every native Streamlit widget matches the
# "Velocity" design system used in app.py.

[theme]
primaryColor = "#FF3B1F"          # molten energy accent
backgroundColor = "#FAFAF7"        # warm paper base
secondaryBackgroundColor = "#F1F1EC"
textColor = "#17181B"
font = "sans serif"

[client]
toolbarMode = "minimal"
